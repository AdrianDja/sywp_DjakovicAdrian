<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 300px;
      height: 300px;
    }

    .prvi {
      background-color: beige;
      border: 3px solid black;
      box-sizing: border-box;
      padding: 50px 65px;
      margin: 0 auto;
    }

    .drugi {
      background-color: aqua;
      margin: 50px 10px 5px 25px;
      border: 2px solid blue;
      border-radius: 50%;
      border-top-right-radius: 30%;
    }
  </style>
</head>

<body>
  <div class="prvi">
    <p>Ovo je prvi paragraf u div elementu</p>
  </div>
  <div class="drugi"></div>

</body>

</html>
