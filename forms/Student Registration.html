<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form>
    <h1>Student Registration Form</h1>
    <br><label for="Rollno">Roll no.:</label>
    <input type="text" id="Rollno" />
    <br><label for="STN">Students name: </label>
    <input type="text" id="STN" placeholder="First Name" />
    <label>-</label>
    <input type="text" id="STLN" placeholder="Last Name" />
    <br>
    <label for="father">Fatrher's name:</label>
    <input type="text" id="father" />
    <br><label for="Datu">Date of birth:</label>
    <input type="date" name="Datu" id="Datu" />
    <br><label for="Teli">Mobile no.:</label>
    <input type="tel" name="Teli" id="Teli" />
    <br><label for="Emi">Email id:</label>
    <input type="email" name="Emi" id="Emi" />
    <br><label for="PASS">Password:</label>
    <input type="password" name="PASS" id="PASS" />
    <br>
    <p>Gender:</p>
    <input type="radio" name="Mal" id="Male" value="Male" />
    <label for="Male">Male</label>
    <input type="radio" name="Mal" id="Female" value="Female" />
    <label for="Female">Female</label>
    <br>
    <p>Deparment:</p>
    <input type="checkbox" name="klub" id="CSE" value="CSE" />
    <label for="CSE">CSE</label>
    <input type="checkbox" name="klub1" id="IT" />
    <label for="IT">IT</label>
    <input type="checkbox" name="klub2" id="ECE" value="ECE" />
    <label for="real">ECE</label>
    <input type="checkbox" name="klub3" id="barca" />
    <label for="barca">Barcelona</label>


  </form>

</body>

</html>
