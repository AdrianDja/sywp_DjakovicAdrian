<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forme</title>
</head>

<body>
  <h1>Forme u HTML-u</h1>
  <form action="#" method="get">
    <label for="ime">Unesi ime:</label>
    <input type="text" id="ime" placeholder="Unesi ime..." disabled /><br>
    <label for="Prezime">Prezime</label>
    <input type="text" id="Prezime" size="10" maxlength="4" /><br>
    <label for="pass">Unesi lozinku:</label>
    <input type="password" name="pass" id="pass" required /><br>
    <label for="mail">Mail</label>
    <input type="email" name="mail" id="mail" />
    <br>
    <label for="dat">Izaberi datum</label>
    <input type="date" name="datum" id="dat" /><br>
    <label for="boja">izaberi boju: </label>
    <input type="color" name="b" id="boja" /><br>
    <label for="d">Datoteka:</label>
    <input type="file" name="" id="d" /><br>
    <input type="tel" name="" id="tel" /><br>
    <p>Odaberi klub:</p>
    <input type="checkbox" name="klub" id="real" value="Real Madrid" />
    <label for="real">Real</label><br>
    <input type="checkbox" name="klub1" id="barca" />
    <label for="barca">Barcelona</label>

    <p>Odaberi klub:</p>

    <input type="radio" name="klub" id="real" value="Real Madrid" />
    <label for="real">Real</label><br>
    <input type="radio" name="klub" id="barca" />
    <label for="barca">Barcelona</label>


    <br>
    <input type="submit" name="Pošalji" id="" />
    <input type="reset" value="Obriši" />
  </form>

</body>

</html>
